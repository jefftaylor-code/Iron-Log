<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <meta name="theme-color" content="#0d0d0f"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Iron Log"/>
  <link rel="manifest" href="manifest.json"/>
  <title>Iron Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#0d0d0f;--bg2:#111114;--bg3:#141416;--border:#1e1e24;--border2:#2a2a30;
      --text:#fff;--text2:#aaa;--text3:#555;--success:#3DBF7F;--warn:#F5A623;
      --danger:#E05C5C;--info:#4F8EF7;--jj:#F0B429}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overscroll-behavior:none}
    select,input,button{font-family:'DM Sans',sans-serif}
    select{appearance:none;-webkit-appearance:none}
    input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
    input[type=number]{-moz-appearance:textfield}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
    @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    #app{padding-bottom:88px}
    /* HEADER */
    .header{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 14px 6px}
    .logo{font-family:'Bebas Neue',sans-serif;font-size:38px;letter-spacing:5px;line-height:1}
    .header-sub{font-size:10px;color:var(--text3);letter-spacing:2px;margin-top:2px;text-transform:uppercase}
    .date-badge{text-align:center;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:5px 12px}
    .date-num{font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1}
    .date-mon{font-size:10px;color:var(--text3);letter-spacing:2px}
    .day-pill{margin:0 14px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:12px;color:#fff;letter-spacing:1.5px;font-weight:600;text-transform:uppercase}
    /* CAL BAR */
    .cal-bar{display:flex;align-items:center;justify-content:space-between;background:rgba(245,166,35,0.08);border:1px solid rgba(245,166,35,0.2);border-radius:8px;padding:6px 12px;margin:0 10px 8px}
    .cal-total{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--warn)}
    .cal-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px}
    .cal-sub{font-size:9px;color:var(--text3);text-align:right}
    /* CARDS */
    .row-list{padding:0 10px;display:flex;flex-direction:column;gap:10px}
    .card{background:var(--bg2);border:1px solid var(--border);border-radius:13px;overflow:hidden;animation:fadeIn 0.2s ease}
    .card-bar{display:flex;align-items:center;gap:6px;padding:8px 10px}
    .card-idx{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
    .card-name{flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;display:flex;align-items:center;gap:5px}
    .card-name .ph{color:var(--text3);font-weight:400}
    .prog-pill{font-size:9px;padding:2px 6px;border-radius:9px;font-weight:700;flex-shrink:0}
    .jj-prog{font-size:9px;padding:2px 6px;border-radius:9px;font-weight:700;flex-shrink:0;background:rgba(240,180,41,0.15);color:var(--jj)}
    .tip-btn{background:none;border:1px solid;border-radius:6px;font-size:12px;padding:2px 6px;cursor:pointer;flex-shrink:0}
    .sync-ok{font-size:9px;color:var(--success);background:#1a3a1a;padding:2px 5px;border-radius:4px;flex-shrink:0}
    .rm-btn{background:none;border:none;color:#2a2a30;cursor:pointer;font-size:15px;padding:2px 5px;flex-shrink:0}
    .card-body{padding:8px 10px 10px;display:flex;flex-direction:column;gap:8px}
    /* GROUP + WHO ROW */
    .gw-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
    .field-wrap{display:flex;flex-direction:column;gap:3px}
    .field-lbl{font-size:9px;color:var(--text3);letter-spacing:1.5px;font-weight:700;text-transform:uppercase}
    .sel-wrap{position:relative}
    .sel-wrap select{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:7px;color:var(--text);font-size:12px;padding:7px 22px 7px 8px;cursor:pointer}
    .sel-wrap select:disabled{opacity:0.3;cursor:not-allowed}
    .sel-arr{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:10px;pointer-events:none}
    .custom-inp{margin-top:5px;width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:7px;color:var(--text);font-size:12px;padding:7px 8px;outline:none}
    /* WHO TOGGLE */
    .who-wrap{display:flex;flex-direction:column;gap:3px}
    .who-btns{display:flex;gap:3px}
    .who-btn{flex:1;border:1px solid var(--border2);border-radius:6px;background:transparent;color:var(--text3);font-size:10px;font-weight:700;padding:6px 4px;cursor:pointer;letter-spacing:0.5px;transition:all 0.15s}
    .who-btn.active-jeff{background:rgba(79,142,247,0.2);border-color:#4F8EF7;color:#4F8EF7}
    .who-btn.active-both{background:rgba(61,191,127,0.2);border-color:var(--success);color:var(--success)}
    .who-btn.active-jj{background:rgba(240,180,41,0.2);border-color:var(--jj);color:var(--jj)}
    /* SEQUENCE */
    .seq-wrap{display:flex;flex-wrap:wrap;gap:5px;padding:2px 0}
    .seq-item{font-size:10px;padding:4px 9px;border-radius:12px;border:1px solid var(--border2);color:var(--text3);white-space:nowrap;cursor:pointer;transition:all 0.15s;-webkit-user-select:none;user-select:none}
    .seq-item:active{opacity:0.7}
    .seq-item.current{font-weight:700;background:rgba(255,255,255,0.07)}
    .seq-item.custom-chip{border-style:dashed}
    .seq-num{font-size:9px;opacity:0.6;margin-right:2px}
    /* INFO ROWS */
    .prev-hint{font-size:9px;color:var(--text3);font-style:italic}
    .prev-hint span{color:var(--warn)}
    .target-row{font-size:11px;color:#fff;font-weight:600;letter-spacing:0.5px}
    .target-row span{color:var(--warn);margin-right:4px}
    .form-cue{font-size:10px;color:var(--text3);border-left:2px solid var(--info);padding:3px 8px;font-style:italic;line-height:1.4}
    /* REST SECTION */
    .rest-section{background:rgba(255,165,0,0.06);border:1px solid rgba(255,165,0,0.2);border-radius:8px;padding:7px 9px}
    .rest-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
    .rest-label{font-size:9px;font-weight:700;color:var(--warn);letter-spacing:1.5px;text-transform:uppercase}
    .rest-hint{font-size:9px;color:var(--text3)}
    .rest-btns{display:flex;gap:5px}
    .rest-btn{flex:1;border:1px solid;border-radius:6px;font-size:11px;font-weight:700;padding:7px 0;cursor:pointer;text-align:center;transition:background 0.15s}
    /* SETS */
    .person-section{display:flex;flex-direction:column;gap:4px}
    .person-hdr{display:flex;align-items:center;gap:6px;padding:4px 0 2px}
    .person-label{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
    .sets-cols{display:grid;grid-template-columns:26px 1fr 1fr 80px;gap:5px;font-size:8px;color:var(--text3);letter-spacing:1.2px;text-transform:uppercase;padding:0 0 2px}
    .set-row{display:grid;grid-template-columns:26px 1fr 1fr 80px;gap:5px;align-items:center}
    .set-num{width:24px;height:28px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;transition:background 0.2s}
    .set-inp{background:var(--bg);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-size:15px;font-weight:600;padding:5px 4px;text-align:center;outline:none;width:100%;transition:border-color 0.2s}
    .set-row.done .set-inp{border-color:#1a3a1a;color:var(--text3)}
    .set-row.done .set-num{background:#1a3a1a !important}
    .done-btn{height:28px;border:1px solid;border-radius:6px;font-size:10px;font-weight:700;cursor:pointer;letter-spacing:0.3px;transition:all 0.15s;white-space:nowrap}
    /* JJ sets use amber done state */
    .jj-sect .set-row.done .set-num{background:#3a2a00 !important}
    .jj-sect .set-row.done .set-inp{border-color:#3a2a00}
    /* NOTES */
    .notes-inp{background:transparent;border:none;border-top:1px solid var(--border);color:var(--text3);font-size:11px;padding:7px 0 0;outline:none;width:100%}
    .notes-inp::placeholder{color:#222}
    /* ADD BTN */
    .add-btn{display:block;width:calc(100% - 20px);margin:12px 10px 0;background:var(--bg2);border:1px dashed var(--border2);border-radius:10px;color:var(--text3);font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:3px;padding:12px;cursor:pointer}
    /* FOOTER */
    .sync-footer{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:10px 14px;z-index:100;transition:bottom 0.2s}
    .sync-info{font-size:12px}
    .sync-btn{border:1px solid;border-radius:9px;font-size:12px;font-weight:700;padding:9px 16px;cursor:pointer}
    /* TIMER BAR */
    #timerBar{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:3px solid var(--warn);padding:8px 14px 12px;z-index:101;animation:fadeIn 0.2s ease;display:none}
    .tbar-top{display:flex;align-items:center;gap:10px}
    .tbar-lbl{flex:1;font-size:11px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .tbar-time{font-family:'Bebas Neue',sans-serif;font-size:38px;letter-spacing:3px;line-height:1;min-width:66px;text-align:right;transition:color 0.3s}
    .tbar-skip{background:none;border:1px solid var(--border2);color:var(--text2);border-radius:6px;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0}
    .tbar-prog{height:4px;background:var(--border);border-radius:2px;margin-top:7px;overflow:hidden}
    .tbar-fill{height:100%;border-radius:2px;transition:width 1s linear,background 0.5s}
    /* OVERLAYS */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.93);display:flex;align-items:center;justify-content:center;z-index:9999;padding:14px;animation:fadeIn 0.15s ease}
    .tip-box{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;animation:slideUp 0.2s ease}
    .tip-hdr{display:flex;align-items:center;justify-content:space-between;padding:13px 14px 10px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg2);z-index:1}
    .tip-ttl{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px}
    .tip-cls{background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;padding:2px 5px;line-height:1}
    .tip-emoji{padding:16px;text-align:center;font-size:44px;background:var(--bg)}
    .tip-content{padding:12px 14px 6px;display:flex;flex-direction:column;gap:8px}
    .tip-line{display:flex;gap:8px;font-size:13px;color:#ccc;line-height:1.55}
    .tip-bullet{color:var(--info);font-weight:700;flex-shrink:0;font-size:14px}
    .vid-btn{display:block;margin:10px 14px 14px;background:#1a1a2e;border:1px solid var(--info);border-radius:8px;color:var(--info);font-size:12px;font-weight:700;padding:10px;text-align:center;text-decoration:none;letter-spacing:0.5px}
  </style>
</head>
<body>
<div id="app">
  <div class="header">
    <div><div class="logo">IRON LOG</div><div class="header-sub">Jeff + JJ</div></div>
    <div class="date-badge"><div class="date-num" id="dateNum"></div><div class="date-mon" id="dateMon"></div></div>
  </div>
  <div class="day-pill" id="dayPill"></div>
  <div class="cal-bar" id="calBar">
    <div><div class="cal-total" id="calTotal">~0 cal</div><div class="cal-label">Jeff today</div></div>
    <div class="cal-sub" id="calSub">Add exercises</div>
  </div>
  <div class="row-list" id="rowList"></div>
  <button class="add-btn" onclick="addRow()">+ ADD EXERCISE</button>
</div>
<div class="sync-footer" id="syncFooter">
  <div class="sync-info" id="syncInfo"></div>
  <button class="sync-btn" id="syncBtn" onclick="handleSync()">Save to Sheets</button>
</div>
<div id="timerBar">
  <div class="tbar-top">
    <span class="tbar-lbl" id="tbarLabel">REST</span>
    <span class="tbar-time" id="tbarTime">1:00</span>
    <button class="tbar-skip" onclick="cancelTimer()">SKIP</button>
  </div>
  <div class="tbar-prog"><div class="tbar-fill" id="tbarFill" style="width:100%;background:var(--warn)"></div></div>
</div>
<div class="overlay" id="tipOverlay" style="display:none" onclick="closeTip()">
  <div class="tip-box" onclick="event.stopPropagation()">
    <div class="tip-hdr"><div class="tip-ttl" id="tipTitle"></div><button class="tip-cls" onclick="closeTip()">x</button></div>
    <div id="tipBody"></div>
  </div>
</div>
<script>
var APPS_SCRIPT_URL="https://script.google.com/macros/s/AKfycbzxv2Yzr6imw58OS4TxwPzWuMRCGaxFvgPevpt5br8hRw4wkrRLD_nzwcxhRsKUvkeN/exec";

// MET for calorie calc (Jeff = 99kg)
var JEFF_KG=99;
var MET={"Pec Deck":4.0,"Cable Fly":4.0,"Lateral Raise (Dumbbells)":3.5,"Rear Delt Machine":3.5,"Chest Press Machine":5.0,"Straight Arm Pulldown":4.5,"Face Pulls (Cable)":3.5,"Machine Row":5.5,"Lat Pulldown (Neutral Grip)":5.0,"Seated Cable Row (Neutral Grip)":5.0,"Leg Press":6.0,"Romanian Deadlift (Dumbbells)":6.0,"Calf Raise Machine":3.5,"Hip Abductor Machine":3.0,"Goblet Squat":5.5,"Plank":3.5,"Cable Crunch":3.5,"Seated Leg Raise":3.5,"Ab Machine":3.5,"Russian Twist":4.0,"Dead Bug":3.0,"Incline Treadmill Walk":7.5};

var VIDEOS={"Pec Deck":"https://www.youtube.com/results?search_query=pec+deck+fly+machine+correct+form","Cable Fly":"https://www.youtube.com/results?search_query=cable+fly+chest+proper+form","Lateral Raise (Dumbbells)":"https://www.youtube.com/results?search_query=lateral+raise+proper+form+shoulder+safe","Rear Delt Machine":"https://www.youtube.com/results?search_query=rear+delt+machine+proper+form","Chest Press Machine":"https://www.youtube.com/results?search_query=chest+press+machine+proper+form+men+over+50","Straight Arm Pulldown":"https://www.youtube.com/results?search_query=straight+arm+pulldown+cable+lat+form","Face Pulls (Cable)":"https://www.youtube.com/results?search_query=face+pulls+cable+proper+form+shoulder+health","Machine Row":"https://www.youtube.com/results?search_query=machine+row+proper+form+back","Lat Pulldown (Neutral Grip)":"https://www.youtube.com/results?search_query=lat+pulldown+neutral+grip+proper+form","Seated Cable Row (Neutral Grip)":"https://www.youtube.com/results?search_query=seated+cable+row+proper+form+back","Leg Press":"https://www.youtube.com/results?search_query=leg+press+proper+form+knee+safe","Romanian Deadlift (Dumbbells)":"https://www.youtube.com/results?search_query=dumbbell+romanian+deadlift+proper+form","Calf Raise Machine":"https://www.youtube.com/results?search_query=calf+raise+machine+proper+form","Hip Abductor Machine":"https://www.youtube.com/results?search_query=hip+abductor+machine+proper+form+glutes","Goblet Squat":"https://www.youtube.com/results?search_query=goblet+squat+proper+form+knee+safe","Plank":"https://www.youtube.com/results?search_query=perfect+plank+form+core","Cable Crunch":"https://www.youtube.com/results?search_query=cable+crunch+ab+proper+form","Incline Treadmill Walk":"https://www.youtube.com/results?search_query=incline+treadmill+walk+fat+burn+form"};

// Technique tips
var TIPS={};
TIPS["Pec Deck"]=["Adjust seat so elbows are at shoulder height and arms form a 90-degree angle.","Squeeze chest hard at the front — hold 1 second. This peak contraction is where the muscle work happens.","Control the return. Let it open only as far as is comfortable. Never force a deep stretch with this machine.","Elbows stay on the pads throughout. If they lift off, the weight is too heavy."];
TIPS["Cable Fly"]=["Set cables at chest height. Step forward with a slight forward lean from the hips.","Bring hands together in an arc with elbows slightly bent and fixed — squeeze chest at the peak, hold 1 second.","Return slowly over 2-3 seconds. The eccentric phase at 15-20 reps is where muscle and calorie burn compounds.","The fixed elbow angle is critical — no dynamic bending. This is what makes it safe for your elbow."];
TIPS["Lateral Raise (Dumbbells)"]=["Light weight, strict form. Raise to shoulder height only. Never higher — this is a corrective movement.","Lead with elbows, slight thumb-down rotation at the top. Keep shoulders down throughout — no shrugging.","15 reps strict beats 10 reps sloppy. If you swing to get it up, the weight is too heavy.","Builds medial deltoid width and protects the rotator cuff long-term."];
TIPS["Rear Delt Machine"]=["Sit facing the pad. Set handles so arms are at shoulder height with a slight elbow bend.","Drive handles back and wide, squeezing rear delts hard at full range. Pause 1 second.","This exercise directly counteracts the anterior dominance causing your shoulder impingement. Do not skip it.","Light weight, 15-20 reps, full contraction. Mind-muscle connection here takes a few sessions to develop."];
TIPS["Chest Press Machine"]=["Sit tall, lower back against the pad. Grip handles at mid-chest height.","Push straight out exhaling on the press. Squeeze chest at full extension for 1 second.","Elbows at 45 degrees, not flared wide. Protects the shoulder and keeps the chest working.","Short 60-second rest keeps heart rate elevated for fat burning."];
TIPS["Straight Arm Pulldown"]=["Arms stay almost fully straight — elbow barely bends. This is the defining cue of this exercise.","Hinge slightly at hips, pull the bar down to your thighs using shoulder extension only.","Best lat isolation during elbow recovery. Zero bending stress on the joint. Do not rush the range.","Squeeze the lats hard at the bottom and hold 1 second. At 15-20 reps you will feel a deep lat burn."];
TIPS["Face Pulls (Cable)"]=["Cable at face height, rope attachment. Step back enough to load the cable fully.","Pull rope to face, separate hands, flare elbows high and wide — think double-bicep pose.","This is medicine for your shoulder impingement. It strengthens external rotators that prevent it recurring.","Light weight, 20 reps, full range. Never skip this. It is the exercise that keeps your shoulder healthy."];
TIPS["Machine Row"]=["The chest pad eliminates lower back strain — a key advantage over free-weight rows.","Pull handles to lower chest, driving elbows straight back. Squeeze mid-back hard for 1 second.","At 12-15 reps rows become a significant calorie burner — the back is a large muscle group.","Avoid shrugging. Keep shoulders down and back. Upper traps should not be doing this work."];
TIPS["Lat Pulldown (Neutral Grip)"]=["Neutral grip reduces elbow stress significantly compared to wide pronated grip.","Pull to upper chest, driving elbows straight down. Lean back only 10-15 degrees.","Full stretch at the top — let shoulder blades rise before each rep. This range builds the lat effectively.","At 12-15 reps with 60-second rest, this creates real metabolic load given the large back muscles involved."];
TIPS["Seated Cable Row (Neutral Grip)"]=["Close grip neutral attachment. Sit tall with natural arch. Do not round forward even when stretching.","Pull handle to lower sternum. Squeeze shoulder blades together and hold 1 second.","The stretch forward is part of the rep — let shoulder blades protract fully.","At 12-15 reps you will feel this throughout your back. Large muscle mass makes it excellent for fat burning."];
TIPS["Leg Press"]=["Feet shoulder-width, mid-platform, toes slightly out. Lower to 90 degrees only — protect the knee.","Drive through your whole foot. Never lock out the knee at the top — keep a slight bend always.","At 15-20 reps the leg press becomes cardiovascular exercise. Breathing hard is the goal.","The highest-calorie-burn exercise. Legs are the largest muscle group. Push this one hard within your range."];
TIPS["Romanian Deadlift (Dumbbells)"]=["Hinge at hips, push them back as you lower. Back flat throughout. Soft bend in the knees.","Lower until you feel strong hamstring stretch, usually mid-shin. Stop there — lower means rounded back.","Drive hips forward to come up, squeezing glutes at top. Hip hinge, not a squat.","One of the best posterior chain exercises. Hamstrings and glutes are large muscles — burns well at 12-15 reps."];
TIPS["Calf Raise Machine"]=["Full stretch at the bottom is mandatory — lower heels as far as possible before each rep.","Rise as high as possible, squeeze hard at the top for 1-2 seconds. Calves need full range to develop.","Calves respond to high reps — 20 is the target. Slow and deliberate, no bouncing.","Short 45-second rest is fine for calves. They recover fast. Keep rest short to maintain heart rate."];
TIPS["Hip Abductor Machine"]=["Sit back, hips at 90 degrees. Push knees out slowly against the pads, squeeze outer glutes at full range.","Strong hip abductors reduce knee valgus in other exercises and protect knee joint long-term.","Light weight, 20 reps, controlled movement. This is corrective and protective, not a strength move.","At 2 sets of 20 this is a finisher. Keep rest to 45 seconds."];
TIPS["Goblet Squat"]=["Hold dumbbell vertically at chest. Feet shoulder-width, toes out 30 degrees.","Sit back and down between your knees — elbows track inside knees at bottom. Chest stays tall.","Knee-friendly squat variation — goblet position keeps torso upright, reducing knee stress significantly.","Go only as deep as mobility and knee comfort allow. Parallel or slightly above is fine."];
TIPS["Plank"]=["Elbows under shoulders (or on hands), body in a straight line from head to heels.","Brace your core as if taking a punch. Squeeze glutes. Breathe normally throughout.","Use the 45-second timer here as your plank hold timer — tap it and hold until it counts down.","Build from 30 to 45 to 60 seconds over weeks. Two minutes is elite for a man over 50."];
TIPS["Cable Crunch"]=["Kneel facing cable, rope at back of neck. Hips stay still throughout — all movement in the abs.","Round the upper back down — not with neck or hip flexors. Squeeze abs hard at the bottom.","Return slowly. At 20 reps this becomes a genuine ab burn. Keep weight moderate.","Short rest keeps core pumped and heart rate elevated."];
TIPS["Seated Leg Raise"]=["Sit on bench edge, hands gripping sides, legs extended. Lean back slightly.","Raise legs to hip height contracting lower abs. Slow and controlled, not momentum.","If too difficult, bend knees slightly. Work toward full extension over weeks.","15 controlled reps is harder than it sounds."];
TIPS["Ab Machine"]=["Pad on upper chest and shoulders. Crunch forward rounding upper back — not pulling with neck.","Squeeze at full contraction, hold 1 second. Return slowly.","15 reps at moderate weight with full contraction beats heavy weight with partial range.","Keep rest short at 45-60 seconds to maintain heart rate elevation."];
TIPS["Russian Twist"]=["Sit with knees bent, lean back 45 degrees. Hold weight, rotate side to side from the torso.","Touch weight to floor each side. Exhale on each rotation. Keep chest up.","If lower back hurts, keep feet on floor and reduce rotation range.","20 reps is challenging. Keep rest to 45 seconds."];
TIPS["Dead Bug"]=["Lie on back, arms to ceiling, knees bent at 90 degrees in the air. Lower back pressed to floor.","Slowly lower right arm overhead and extend left leg — lower back must not arch off the floor.","This teaches core stability — the most important core function for protecting your spine long-term.","10 slow controlled reps. Quality over quantity."];
TIPS["Incline Treadmill Walk"]=["Set incline 8-12 percent, speed 3.5-4.0 mph. Hold handrails for balance only.","Target heart rate for fat burning: 120-135 bpm. Use the treadmill monitor or your watch.","This is your primary fat-burning tool — 40 minutes burns approximately 400-500 calories.","JJ should push slightly harder — either 1-2% more incline or 0.3 mph faster to match intensity."];

var defaultTip=["Set up the machine to fit your body before starting.","Focus on the target muscle with controlled reps.","Control the lowering phase over 2-3 seconds.","At higher rep ranges, breathing hard is the goal — that means fat is burning."];

// ── STATE ──────────────────────────────────────────────────
var rows=[];
var timerInterval=null,timerRemaining=0,timerTotal=0,activeTimerRowId=null;

// ── HELPERS ────────────────────────────────────────────────
function getTodayDate(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}
function getTodayDay(){return ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][new Date().getDay()];}
function uid(){return "r"+Date.now()+Math.floor(Math.random()*99999);}
function loadLocal(k,d){try{var v=localStorage.getItem(k);return v!=null?JSON.parse(v):d;}catch(e){return d;}}
function saveLocal(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function getHist(key){return loadLocal(key,{});}
function saveHist(key,name,sets){var h=getHist(key);h[name]=sets.map(function(s){return{weight:String(s.weight||""),reps:String(s.reps||"")};});saveLocal(key,h);}
function getDefSets(name,defW,defR,histKey){
  var h=getHist(histKey);
  if(h[name])return h[name].map(function(s){return{weight:String(s.weight||""),reps:String(s.reps||""),done:false};});
  var ws=defW[name],rs=defR[name];
  if(ws&&rs){var len=Math.max(ws.length,rs.length);return Array.from({length:len},function(_,i){return{weight:String(ws[i]||0),reps:String(rs[i]||0),done:false};});}
  return Array.from({length:MAX_SETS},function(){return{weight:"",reps:"",done:false};});
}
function persist(){saveLocal(STORAGE_KEY,rows);}
function eh(s){return String(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function emptyRow(){
  var last=rows[rows.length-1];
  return{id:uid(),date:getTodayDate(),group:last?last.group:"",exercise:"",customExercise:"",
    person:"both",
    sets:Array.from({length:MAX_SETS},function(){return{weight:"",reps:"",done:false};}),
    jjSets:Array.from({length:MAX_SETS},function(){return{weight:"",reps:"",done:false};}),
    notes:"",synced:false};
}

function calcSessionCal(){
  var t=0,today=getTodayDate();
  for(var i=0;i<rows.length;i++){
    var r=rows[i];
    if(r.date!==today||r.person==="jj")continue;
    var nm=r.exercise==="__custom__"?r.customExercise:r.exercise;
    if(nm)t+=Math.round((MET[nm]||4)*JEFF_KG*(1.83/60)*r.sets.length);
  }
  return t;
}
function updateCalBar(){
  var c=calcSessionCal();
  var el=document.getElementById("calTotal");if(el)el.textContent="~"+c+" cal";
  var s=document.getElementById("calSub");if(s)s.textContent=c>300?"Great burn!":c>150?"Keep going!":"Add exercises";
}

// ── INIT ───────────────────────────────────────────────────
function init(){
  var now=new Date();
  document.getElementById("dateNum").textContent=now.getDate();
  document.getElementById("dateMon").textContent=now.toLocaleString("default",{month:"short"}).toUpperCase();
  document.getElementById("dayPill").textContent=getTodayDay().toUpperCase()+" - "+getTodayDate();
  var saved=loadLocal(STORAGE_KEY,[]);
  rows=saved.length?saved:[emptyRow()];
  renderAll();updateFooter();updateCalBar();
}

// ── BUILD CARD ─────────────────────────────────────────────
function buildCard(row,idx){
  var color=GROUP_COLORS[row.group]||"#555";
  var displayName=row.exercise==="__custom__"?row.customExercise:row.exercise;
  var hasEx=(row.exercise&&row.exercise!=="__custom__")||row.customExercise;
  var jDone=row.sets.filter(function(s){return s.done;}).length;
  var jjDone=row.jjSets.filter(function(s){return s.done;}).length;
  var showJeff=row.person==="jeff"||row.person==="both";
  var showJJ=row.person==="jj"||row.person==="both";
  var isTimerRow=activeTimerRowId===row.id;
  var target=TARGETS[row.exercise]||"";
  var jeffSafe=!row.exercise||row.exercise==="__custom__"||JEFF_SAFE[row.exercise];

  // Tappable sequence chips
  var seqHtml="";
  if(row.group&&EXERCISE_MAP[row.group]){
    var exList=EXERCISE_MAP[row.group];
    var chips=exList.map(function(ex,i){
      var isCurrent=ex===row.exercise;
      var safe=JEFF_SAFE[ex];
      var chipColor=isCurrent?color:"";
      return '<span class="seq-item'+(isCurrent?" current":"")
        +'" style="'+(isCurrent?"color:"+color+";border-color:"+color+";background:"+color+"18":"")
        +(!safe&&row.person!=="jj"?";opacity:0.4":"")+'"'
        +' data-rowid="'+row.id+'" data-ex="'+eh(ex)+'" onclick="onSeqTap(this)">'
        +'<span class="seq-num">'+(i+1)+'</span>'+eh(ex)+'</span>';
    }).join("");
    chips+='<span class="seq-item custom-chip" data-rowid="'+row.id+'" data-ex="__custom__" onclick="onSeqTap(this)">+ Custom</span>';
    seqHtml='<div class="seq-wrap">'+chips+'</div>';
  }

  // Jeff overload nudge
  var prevHint="";
  if(row.exercise&&row.exercise!=="__custom__"&&showJeff){
    var h=getHist(HISTORY_KEY);
    if(h[row.exercise]&&h[row.exercise][0]){
      var p=h[row.exercise][0];var pw=parseFloat(p.weight||0);
      if(pw>0)prevHint='<div class="prev-hint">Jeff prev: <span>'+pw+'lbs x '+p.reps+'</span> — try <span>'+(pw+5)+'lbs</span></div>';
    }
  }

  // JJ overload nudge
  var jjPrevHint="";
  if(row.exercise&&row.exercise!=="__custom__"&&showJJ){
    var hj=getHist(JJ_HIST_KEY);
    if(hj[row.exercise]&&hj[row.exercise][0]){
      var pj=hj[row.exercise][0];var pjw=parseFloat(pj.weight||0);
      if(pjw>0)jjPrevHint='<div class="prev-hint" style="color:'+JJ_COLOR+'88">JJ prev: <span style="color:'+JJ_COLOR+'">'+pjw+'lbs x '+pj.reps+'</span> — try <span style="color:'+JJ_COLOR+'">'+(pjw+5)+'lbs</span></div>';
    }
  }

  // Form cue (second tip)
  var formCue="";
  if(row.exercise&&TIPS[row.exercise]&&TIPS[row.exercise][1]){
    var t=TIPS[row.exercise][1];
    formCue='<div class="form-cue">'+eh(t.substring(0,90)+(t.length>90?"...":""))+'</div>';
  }

  // Jeff's set rows
  function buildSetRows(sets,prefix,btnColor,jjMode){
    return sets.map(function(s,si){
      var setColor=jjMode?JJ_COLOR:btnColor;
      return '<div class="set-row'+(s.done?" done":"")+'" id="sr-'+prefix+'-'+si+'">'
        +'<div class="set-num" id="sn-'+prefix+'-'+si+'" style="background:'+(s.done?(jjMode?"#3a2a00":"#1a3a1a"):setColor)+'">'+( s.done?"&#10003;":(si+1))+'</div>'
        +'<input class="set-inp" type="number" inputmode="decimal" value="'+eh(s.weight)+'" placeholder="-" data-prefix="'+prefix+'" data-si="'+si+'" data-field="weight" oninput="onSetInput(this)"/>'
        +'<input class="set-inp" type="number" inputmode="numeric" value="'+eh(s.reps)+'" placeholder="-" data-prefix="'+prefix+'" data-si="'+si+'" data-field="reps" oninput="onSetInput(this)"/>'
        +'<button class="done-btn" style="background:'+(s.done?setColor+"22":"transparent")+';border-color:'+(s.done?setColor:setColor+"44")+';color:'+(s.done?setColor:"#555")+'" data-prefix="'+prefix+'" data-si="'+si+'" onclick="onDoneBtn(this)">'+(s.done?"DONE":"TAP DONE")+'</button>'
        +'</div>';
    }).join("");
  }

  // Safety warning
  var safetyNote=!jeffSafe&&(row.person==="jeff"||row.person==="both")?'<div style="font-size:10px;color:var(--danger);padding:2px 0">&#9888; Jeff: this exercise may load the elbow</div>':"";

  var card=document.createElement("div");
  card.className="card";
  card.id="card-"+row.id;
  card.style.borderColor=row.synced?"#1a3a1a":color+"44";

  var html=
    '<div class="card-bar" style="background:'+color+'18">'
    +'<div class="card-idx" style="background:'+color+'">'+(idx+1)+'</div>'
    +'<div class="card-name">'
    +(displayName?'<strong>'+eh(displayName)+'</strong>':'<span class="ph">New Exercise</span>')
    +(showJeff?'<span class="prog-pill" style="background:'+color+'33;color:'+color+'" id="pp-'+row.id+'">J '+jDone+'/'+row.sets.length+'</span>':"")
    +(showJJ?'<span class="jj-prog" id="ppjj-'+row.id+'">JJ '+jjDone+'/'+row.jjSets.length+'</span>':"")
    +'</div>'
    +(hasEx?'<button class="tip-btn" style="border-color:'+color+'66;color:'+color+'" data-ex="'+eh(displayName)+'" data-grp="'+eh(row.group)+'" onclick="onTipBtn(this)">&#128161;</button>':"")
    +(row.synced?'<span class="sync-ok">saved</span>':"")
    +'<button class="rm-btn" data-rowid="'+row.id+'" onclick="onRemove(this)">x</button>'
    +'</div>'
    +'<div class="card-body">'
    // Group + WHO on same row
    +'<div class="gw-row">'
    +'<div class="field-wrap"><div class="field-lbl">Group</div><div class="sel-wrap">'
    +'<select data-rowid="'+row.id+'" data-field="group" onchange="onSelect(this)">'
    +'<option value="">Select</option>'
    +GROUP_OPTIONS.map(function(g){return'<option value="'+g+'"'+(row.group===g?" selected":"")+'>'+g+'</option>';}).join("")
    +'</select><span class="sel-arr" style="color:'+color+'">v</span></div></div>'
    +'<div class="who-wrap"><div class="field-lbl">Who</div>'
    +'<div class="who-btns">'
    +'<button class="who-btn'+(row.person==="jeff"?" active-jeff":"") +'" data-rowid="'+row.id+'" data-who="jeff" onclick="onWho(this)">JEFF</button>'
    +'<button class="who-btn'+(row.person==="both"?" active-both":"") +'" data-rowid="'+row.id+'" data-who="both" onclick="onWho(this)">BOTH</button>'
    +'<button class="who-btn'+(row.person==="jj"?" active-jj":"") +'" data-rowid="'+row.id+'" data-who="jj" onclick="onWho(this)">JJ</button>'
    +'</div></div>'
    +'</div>'
    // Hidden select for data binding
    +'<select data-rowid="'+row.id+'" data-field="exercise" onchange="onSelect(this)" style="display:none">'
    +(EXERCISE_MAP[row.group]||[]).map(function(ex){return'<option value="'+eh(ex)+'"'+(row.exercise===ex?" selected":"")+'>'+eh(ex)+'</option>';}).join("")
    +'<option value="__custom__"'+(row.exercise==="__custom__"?" selected":"")+'>custom</option>'
    +'</select>'
    +(row.exercise==="__custom__"?'<input class="custom-inp" style="border-color:'+color+'66" placeholder="Exercise name..." value="'+eh(row.customExercise)+'" data-rowid="'+row.id+'" data-field="customExercise" oninput="onSelect(this)"/>':"")
    // Sequence chips
    +seqHtml;

  if(hasEx){
    html+=safetyNote;
    if(prevHint||jjPrevHint)html+=(prevHint||"")+(jjPrevHint||"");
    if(target)html+='<div class="target-row"><span>&#9654;</span>'+eh(target)+'</div>';
    if(formCue)html+=formCue;

    // Rest timer
    html+='<div class="rest-section">'
      +'<div class="rest-header"><span class="rest-label">&#128293; Rest Timer</span><span class="rest-hint">60s = fat burn zone</span></div>'
      +'<div class="rest-btns">'
      +[["30s",30],["45s",45],["60s",60],["90s",90]].map(function(p){
        return'<button class="rest-btn" style="background:'+(isTimerRow?color:"transparent")+';border-color:'+color+'77;color:'+(isTimerRow?"#fff":color)+'" data-secs="'+p[1]+'" data-label="'+eh(displayName||"Rest")+'" data-rowid="'+row.id+'" onclick="onRestBtn(this)">'+p[0]+'</button>';
      }).join("")
      +'</div></div>';

    // Jeff's sets
    if(showJeff){
      html+='<div class="person-section">'
        +'<div class="person-hdr"><span class="person-label" style="color:'+color+'">JEFF</span></div>'
        +'<div class="sets-cols"><span>#</span><span>Weight lbs</span><span>Reps</span><span>Status</span></div>'
        +buildSetRows(row.sets,"j-"+row.id,color,false)
        +'</div>';
    }

    // JJ's sets
    if(showJJ){
      html+='<div class="person-section jj-sect">'
        +'<div class="person-hdr"><span class="person-label" style="color:'+JJ_COLOR+'">JJ</span></div>'
        +'<div class="sets-cols"><span>#</span><span>Weight lbs</span><span>Reps</span><span>Status</span></div>'
        +buildSetRows(row.jjSets,"jj-"+row.id,JJ_COLOR,true)
        +'</div>';
    }
  }

  html+='<input class="notes-inp" placeholder="Notes..." value="'+eh(row.notes)+'" data-rowid="'+row.id+'" data-field="notes" oninput="onSelect(this)"/>'
    +'</div>';
  card.innerHTML=html;
  return card;
}

function renderAll(){
  var list=document.getElementById("rowList");
  list.innerHTML="";
  for(var i=0;i<rows.length;i++) list.appendChild(buildCard(rows[i],i));
}
function rerenderCard(rowId){
  var row=rows.find(function(r){return r.id===rowId;});
  if(!row) return;
  var old=document.querySelector('[id="card-'+rowId+'"]');
  if(old) old.replaceWith(buildCard(row,rows.indexOf(row)));
}

// ── HANDLERS ──────────────────────────────────────────────
function onSeqTap(el){
  var rowId=el.dataset.rowid,ex=el.dataset.ex;
  var row=rows.find(function(r){return r.id===rowId;});if(!row) return;
  if(ex==="__custom__"){row.exercise="__custom__";row.customExercise="";row.sets=Array.from({length:MAX_SETS},function(){return{weight:"",reps:"",done:false};});row.jjSets=Array.from({length:MAX_SETS},function(){return{weight:"",reps:"",done:false};});}
  else{row.exercise=ex;row.sets=getDefSets(ex,DEF_W,DEF_R,HISTORY_KEY);row.jjSets=getDefSets(ex,JJ_DEF_W,JJ_DEF_R,JJ_HIST_KEY);}
  row.synced=false;persist();rerenderCard(rowId);updateFooter();updateCalBar();
}

function onWho(el){
  var rowId=el.dataset.rowid,who=el.dataset.who;
  var row=rows.find(function(r){return r.id===rowId;});if(!row) return;
  row.person=who;row.synced=false;persist();rerenderCard(rowId);updateFooter();
}

function onSelect(el){
  var rowId=el.dataset.rowid,field=el.dataset.field,value=el.value;
  var row=rows.find(function(r){return r.id===rowId;});if(!row) return;
  if(field==="group"){
    row.group=value;row.exercise="";row.customExercise="";
    row.sets=Array.from({length:MAX_SETS},function(){return{weight:"",reps:"",done:false};});
    row.jjSets=Array.from({length:MAX_SETS},function(){return{weight:"",reps:"",done:false};});
  } else if(field==="exercise"&&value&&value!=="__custom__"){
    row.exercise=value;row.sets=getDefSets(value,DEF_W,DEF_R,HISTORY_KEY);row.jjSets=getDefSets(value,JJ_DEF_W,JJ_DEF_R,JJ_HIST_KEY);
  } else {row[field]=value;}
  row.synced=false;persist();rerenderCard(rowId);updateFooter();updateCalBar();
}

function onSetInput(el){
  var prefix=el.dataset.prefix,si=parseInt(el.dataset.si),field=el.dataset.field;
  var isJJ=prefix.startsWith("jj-");
  var rowId=isJJ?prefix.slice(3):prefix.slice(2);
  var row=rows.find(function(r){return r.id===rowId;});if(!row) return;
  var setArr=isJJ?row.jjSets:row.sets;
  setArr[si][field]=el.value;
  // Propagate weight forward
  if(field==="weight"&&el.value){
    for(var j=si+1;j<setArr.length;j++){
      setArr[j].weight=el.value;
      var inp=document.querySelector('[id="sr-'+prefix+'-'+j+'"] input[data-field="weight"]');
      if(inp) inp.value=el.value;
    }
  }
  row.synced=false;persist();updateFooter();
}

function onDoneBtn(el){
  var prefix=el.dataset.prefix,si=parseInt(el.dataset.si);
  var isJJ=prefix.startsWith("jj-");
  var rowId=isJJ?prefix.slice(3):prefix.slice(2);
  var row=rows.find(function(r){return r.id===rowId;});if(!row) return;
  var setArr=isJJ?row.jjSets:row.sets;
  setArr[si].done=!setArr[si].done;
  var s=setArr[si];
  var exName=row.exercise==="__custom__"?row.customExercise:row.exercise;
  if(exName){
    if(isJJ) saveHist(JJ_HIST_KEY,exName,row.jjSets);
    else saveHist(HISTORY_KEY,exName,row.sets);
  }
  persist();
  // Surgical DOM update
  var setColor=isJJ?JJ_COLOR:(GROUP_COLORS[row.group]||"#555");
  var doneBg=isJJ?"#3a2a00":"#1a3a1a";
  var sr=document.getElementById("sr-"+prefix+"-"+si);
  var sn=document.getElementById("sn-"+prefix+"-"+si);
  if(sr) sr.className="set-row"+(s.done?" done":"");
  if(sn){sn.innerHTML=s.done?"&#10003;":(si+1);sn.style.background=s.done?doneBg:setColor;}
  el.style.background=s.done?setColor+"22":"transparent";
  el.style.borderColor=s.done?setColor:setColor+"44";
  el.style.color=s.done?setColor:"#555";
  el.textContent=s.done?"DONE":"TAP DONE";
  // Progress pills
  var pill=document.getElementById(isJJ?"ppjj-"+rowId:"pp-"+rowId);
  var arr=isJJ?row.jjSets:row.sets;
  if(pill) pill.textContent=(isJJ?"JJ ":"J ")+arr.filter(function(x){return x.done;}).length+"/"+arr.length;
  // Auto-start 60s timer only when Jeff marks done (not JJ, not undo)
  if(!isJJ&&s.done){
    startTimer(60,(exName||"Exercise")+" Set "+(si+1),rowId);
  } else if(!isJJ&&!s.done&&activeTimerRowId===rowId){
    cancelTimer();
  }
  updateFooter();
}

function onRemove(el){
  if(rows.length<=1) return;
  rows=rows.filter(function(r){return r.id!==el.dataset.rowid;});
  persist();renderAll();updateFooter();updateCalBar();
}
function onRestBtn(el){startTimer(parseInt(el.dataset.secs),el.dataset.label,el.dataset.rowid);}
function onTipBtn(el){openTip(el.dataset.ex,el.dataset.grp);}
function addRow(){rows.push(emptyRow());persist();renderAll();updateFooter();updateCalBar();setTimeout(function(){window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});},50);}

// ── SYNC ──────────────────────────────────────────────────
function updateFooter(){
  var n=rows.filter(function(r){return !r.synced&&(r.exercise||r.customExercise);}).length;
  var el=document.getElementById("syncInfo");
  if(el) el.innerHTML=n>0?'<span style="color:#F5A623">&#9679; '+n+' unsaved</span>':'<span style="color:#3DBF7F">&#9679; All saved</span>';
  var btn=document.getElementById("syncBtn");
  if(btn){btn.style.borderColor="#4F8EF7";btn.style.color="#4F8EF7";btn.style.background="#1a1a2a";}
}

async function handleSync(){
  var unsynced=rows.filter(function(r){return !r.synced&&(r.exercise||r.customExercise);});
  var btn=document.getElementById("syncBtn");
  if(!unsynced.length){btn.textContent="Nothing new";setTimeout(function(){btn.textContent="Save to Sheets";updateFooter();},2500);return;}
  btn.textContent="Saving...";btn.disabled=true;
  var day=getTodayDay();
  var values=unsynced.map(function(r){
    var nm=r.exercise==="__custom__"?r.customExercise:r.exercise;
    return[r.date,day,r.group,nm,r.person,
      r.sets[0]?r.sets[0].weight||"":"",r.sets[0]?r.sets[0].reps||"":"",
      r.sets[1]?r.sets[1].weight||"":"",r.sets[1]?r.sets[1].reps||"":"",
      r.sets[2]?r.sets[2].weight||"":"",r.sets[2]?r.sets[2].reps||"":"",
      r.sets[3]?r.sets[3].weight||"":"",r.sets[3]?r.sets[3].reps||"":"",
      r.jjSets[0]?r.jjSets[0].weight||"":"",r.jjSets[0]?r.jjSets[0].reps||"":"",
      r.jjSets[1]?r.jjSets[1].weight||"":"",r.jjSets[1]?r.jjSets[1].reps||"":"",
      r.jjSets[2]?r.jjSets[2].weight||"":"",r.jjSets[2]?r.jjSets[2].reps||"":"",
      r.jjSets[3]?r.jjSets[3].weight||"":"",r.jjSets[3]?r.jjSets[3].reps||"":"",
      r.notes||""];
  });
  try{
    await fetch(APPS_SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify({rows:values})});
    unsynced.forEach(function(u){var r=rows.find(function(x){return x.id===u.id;});if(r)r.synced=true;});
    persist();renderAll();updateCalBar();
    btn.textContent="Saved!";btn.style.color="#3DBF7F";btn.style.borderColor="#3DBF7F";btn.style.background="#1a3a1a";
    setTimeout(function(){btn.textContent="Save to Sheets";btn.disabled=false;updateFooter();},3000);
  }catch(err){
    btn.textContent="Failed";btn.style.color="#E05C5C";btn.style.borderColor="#E05C5C";btn.disabled=false;
    setTimeout(function(){btn.textContent="Save to Sheets";updateFooter();},4000);
  }
}

// ── TIMER ─────────────────────────────────────────────────
function startTimer(secs,label,rowId){
  clearInterval(timerInterval);
  timerRemaining=secs;timerTotal=secs;activeTimerRowId=rowId;
  var lbl=document.getElementById("tbarLabel");if(lbl){lbl.textContent=label;lbl.dataset.orig=label;}
  document.getElementById("timerBar").style.display="block";
  document.getElementById("syncFooter").style.bottom="60px";
  document.getElementById("app").style.paddingBottom="144px";
  tickTimer();
  timerInterval=setInterval(function(){timerRemaining--;if(timerRemaining<=0){timerRemaining=0;clearInterval(timerInterval);}tickTimer();},1000);
  if(rowId) rerenderCard(rowId);
}
function tickTimer(){
  var min=Math.floor(timerRemaining/60),sec=timerRemaining%60;
  var done=timerRemaining===0;
  var pct=timerTotal>0?timerRemaining/timerTotal:0;
  var tEl=document.getElementById("tbarTime");var fEl=document.getElementById("tbarFill");var lEl=document.getElementById("tbarLabel");
  if(tEl){tEl.textContent=done?"GO!":min+":"+(sec<10?"0":"")+sec;tEl.style.color=done?"#3DBF7F":pct>0.5?"#F5A623":"#E05C5C";}
  if(fEl){fEl.style.width=(pct*100)+"%";fEl.style.background=done?"#3DBF7F":pct>0.5?"#F5A623":"#E05C5C";}
  if(lEl&&done) lEl.textContent="REST DONE - GO!";
  else if(lEl&&lEl.dataset.orig) lEl.textContent=lEl.dataset.orig;
}
function cancelTimer(){
  clearInterval(timerInterval);
  document.getElementById("timerBar").style.display="none";
  document.getElementById("syncFooter").style.bottom="0";
  document.getElementById("app").style.paddingBottom="88px";
  var lEl=document.getElementById("tbarLabel");if(lEl)lEl.dataset.orig="";
  if(activeTimerRowId){rerenderCard(activeTimerRowId);activeTimerRowId=null;}
}

// ── TIPS ──────────────────────────────────────────────────
function openTip(exName,group){
  document.getElementById("tipTitle").textContent=exName;
  document.getElementById("tipOverlay").style.display="flex";
  var emoji=GROUP_EMOJI[group]||"💪";
  var tipLines=TIPS[exName]||defaultTip;
  var lines="";
  for(var i=0;i<tipLines.length;i++) lines+='<div class="tip-line"><span class="tip-bullet">&#x203A;</span><span>'+eh(tipLines[i])+'</span></div>';
  var videoUrl=VIDEOS[exName]||("https://www.youtube.com/results?search_query="+encodeURIComponent(exName+"+proper+form"));
  document.getElementById("tipBody").innerHTML='<div class="tip-emoji">'+emoji+'</div><div class="tip-content">'+lines+'</div><a class="vid-btn" href="'+videoUrl+'" target="_blank" rel="noopener">&#9654; Watch Form Video on YouTube</a>';
}
function closeTip(){document.getElementById("tipOverlay").style.display="none";}
document.addEventListener("keydown",function(e){if(e.key==="Escape"){cancelTimer();closeTip();}});

try{init();}catch(err){document.getElementById("rowList").innerHTML='<div style="color:#E05C5C;padding:20px;font-size:13px">Error: '+err.message+'</div>';}
</script>
