<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <meta name="theme-color" content="#0d0d0f"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Iron Log"/>
  <link rel="manifest" href="manifest.json"/>
  <title>Iron Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#0d0d0f;--bg2:#111114;--bg3:#141416;--border:#1e1e24;--border2:#2a2a30;
      --text:#fff;--text2:#aaa;--text3:#555;--success:#3DBF7F;--warn:#F5A623;
      --danger:#E05C5C;--info:#4F8EF7;--purple:#A855F7}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overscroll-behavior:none}
    select,input,button{font-family:'DM Sans',sans-serif}
    select{appearance:none;-webkit-appearance:none}
    input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
    input[type=number]{-moz-appearance:textfield}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
    @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

    /* APP */
    #app{padding-bottom:88px}
    .header{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 14px 6px}
    .logo{font-family:'Bebas Neue',sans-serif;font-size:38px;letter-spacing:5px;line-height:1}
    .header-sub{font-size:10px;color:var(--text3);letter-spacing:2px;margin-top:2px;text-transform:uppercase}
    .date-badge{text-align:center;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:5px 12px}
    .date-num{font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1}
    .date-mon{font-size:10px;color:var(--text3);letter-spacing:2px}
    /* Day pill now shows WHITE date text */
    .day-pill{margin:0 14px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:12px;color:#fff;letter-spacing:1.5px;font-weight:600;text-transform:uppercase}

    /* CARDS */
    .row-list{padding:0 10px;display:flex;flex-direction:column;gap:10px}
    .card{background:var(--bg2);border:1px solid var(--border);border-radius:13px;overflow:hidden;animation:fadeIn 0.2s ease}
    .card-bar{display:flex;align-items:center;gap:6px;padding:8px 10px}
    .card-idx{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
    .card-name{flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
    .card-name .ph{color:var(--text3);font-weight:400}
    .prog-pill{font-size:9px;padding:2px 6px;border-radius:9px;font-weight:700;flex-shrink:0}
    .tip-btn{background:none;border:1px solid;border-radius:6px;font-size:12px;padding:2px 6px;cursor:pointer;flex-shrink:0}
    .sync-ok{font-size:9px;color:var(--success);background:#1a3a1a;padding:2px 5px;border-radius:4px;flex-shrink:0}
    .rm-btn{background:none;border:none;color:#2a2a30;cursor:pointer;font-size:15px;padding:2px 5px;flex-shrink:0}
    .card-body{padding:8px 10px 10px;display:flex;flex-direction:column;gap:8px}

    /* GROUP + EXERCISE on same row */
    .ge-row{display:grid;grid-template-columns:1fr 1fr;gap:7px}
    .field-wrap{display:flex;flex-direction:column;gap:3px}
    .field-lbl{font-size:9px;color:var(--text3);letter-spacing:1.5px;font-weight:700;text-transform:uppercase}
    .sel-wrap{position:relative}
    .sel-wrap select{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:7px;color:var(--text);font-size:12px;padding:7px 22px 7px 8px;cursor:pointer}
    .sel-wrap select:disabled{opacity:0.3;cursor:not-allowed}
    .sel-arr{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:10px;pointer-events:none}
    .custom-inp{margin-top:5px;width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:7px;color:var(--text);font-size:12px;padding:7px 8px;outline:none}

    /* EXERCISE SEQUENCE */
    .seq-wrap{display:flex;flex-wrap:wrap;gap:5px;padding:2px 0}
    .seq-item{font-size:10px;padding:4px 9px;border-radius:12px;border:1px solid var(--border2);color:var(--text3);white-space:nowrap;cursor:pointer;transition:all 0.15s;-webkit-user-select:none;user-select:none}
    .seq-item:active{opacity:0.7;transform:scale(0.95)}
    .seq-item.current{font-weight:700;background:rgba(255,255,255,0.07)}
    .seq-item.custom-chip{border-style:dashed}
    .seq-num{font-size:9px;opacity:0.6;margin-right:2px}
    .prev-hint{font-size:9px;color:var(--text3);padding:0 0 3px;font-style:italic}
    .prev-hint span{color:var(--warn)}
    .cal-bar{display:flex;align-items:center;justify-content:space-between;background:rgba(245,166,35,0.08);border:1px solid rgba(245,166,35,0.2);border-radius:8px;padding:6px 12px;margin:0 10px 4px}
    .cal-total{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--warn)}
    .cal-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px}
    .cal-sub{font-size:9px;color:var(--text3);text-align:right}
    .form-cue{font-size:10px;color:var(--text3);border-left:2px solid var(--info);padding:3px 8px;font-style:italic;line-height:1.4}

    /* TARGET — white and prominent */
    .target-row{font-size:11px;color:#fff;font-weight:600;letter-spacing:0.5px;padding:2px 0}
    .target-row span{color:var(--warn);margin-right:4px}

    /* REST TIMER — fat burn emphasis */
    .rest-section{background:rgba(255,165,0,0.06);border:1px solid rgba(255,165,0,0.2);border-radius:8px;padding:7px 9px}
    .rest-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
    .rest-label{font-size:9px;font-weight:700;color:var(--warn);letter-spacing:1.5px;text-transform:uppercase}
    .rest-hint{font-size:9px;color:var(--text3)}
    .rest-btns{display:flex;gap:5px}
    .rest-btn{flex:1;border:1px solid;border-radius:6px;font-size:11px;font-weight:700;padding:7px 0;cursor:pointer;text-align:center;transition:background 0.15s}

    /* SETS — compact single-row layout */
    .sets-hdr{display:grid;grid-template-columns:26px 1fr 1fr 80px;gap:5px;font-size:8px;color:var(--text3);letter-spacing:1.2px;text-transform:uppercase;padding:0 0 3px}
    .set-row{display:grid;grid-template-columns:26px 1fr 1fr 80px;gap:5px;align-items:center}
    .set-num{width:24px;height:28px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;transition:background 0.2s}
    .set-inp{background:var(--bg);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-size:15px;font-weight:600;padding:5px 4px;text-align:center;outline:none;width:100%;transition:border-color 0.2s}
    .done-btn{height:28px;border:1px solid;border-radius:6px;font-size:10px;font-weight:700;cursor:pointer;letter-spacing:0.5px;transition:all 0.15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    /* done state — green left border on row, no strikethrough on inputs */
    .set-row.done .set-inp{border-color:#1a3a1a;color:var(--text2)}
    .set-row.done .set-num{background:#1a3a1a !important}

    /* NOTES + BUDDY */
    .notes-inp{background:transparent;border:none;border-top:1px solid var(--border);color:var(--text3);font-size:11px;padding:7px 0 0;outline:none;width:100%}
    .notes-inp::placeholder{color:#222}
    .buddy-inp{background:transparent;border:none;border-top:1px solid #1a3a1a;color:#fff;font-size:11px;padding:7px 0 0;outline:none;width:100%;font-weight:500}
    .buddy-inp::placeholder{color:#1a4a2a}

    .add-btn{display:block;width:calc(100% - 20px);margin:12px 10px 0;background:var(--bg2);border:1px dashed var(--border2);border-radius:10px;color:var(--text3);font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:3px;padding:12px;cursor:pointer}

    /* FOOTER */
    .sync-footer{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:10px 14px;z-index:100}
    .sync-info{font-size:12px}
    .sync-btn{border:1px solid;border-radius:9px;font-size:12px;font-weight:700;padding:9px 16px;cursor:pointer}

    /* OVERLAYS */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.93);display:flex;align-items:center;justify-content:center;z-index:9999;padding:14px;animation:fadeIn 0.15s ease}
    .timer-box{background:var(--bg2);border:1px solid var(--border2);border-radius:20px;padding:26px 38px;text-align:center;animation:slideUp 0.2s ease}
    .timer-lbl{font-size:11px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
    .timer-sub{font-size:11px;color:var(--text3);letter-spacing:3px;text-transform:uppercase;margin:8px 0 16px}
    .timer-dismiss{background:var(--bg3);border:1px solid var(--border2);color:var(--text2);padding:9px 24px;border-radius:8px;cursor:pointer;font-size:11px;letter-spacing:2px;font-weight:700}
    .tip-box{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;animation:slideUp 0.2s ease}
    .tip-hdr{display:flex;align-items:center;justify-content:space-between;padding:13px 14px 10px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg2);z-index:1}
    .tip-ttl{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px}
    .tip-cls{background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;padding:2px 5px;line-height:1}
    .tip-emoji{padding:16px;text-align:center;font-size:44px;background:var(--bg)}
    .tip-content{padding:12px 14px 6px;display:flex;flex-direction:column;gap:8px}
    .tip-line{display:flex;gap:8px;font-size:13px;color:#ccc;line-height:1.55}
    .tip-bullet{color:var(--info);font-weight:700;flex-shrink:0;font-size:14px}
    .vid-btn{display:block;margin:10px 14px 14px;background:#1a1a2e;border:1px solid var(--info);border-radius:8px;color:var(--info);font-size:12px;font-weight:700;padding:10px;text-align:center;text-decoration:none;letter-spacing:0.5px}
  /* TIMER BAR — bottom strip, no popup */
  #timerBar{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:3px solid var(--warn);padding:8px 14px 12px;z-index:101;animation:fadeIn 0.2s ease}
  .tbar-top{display:flex;align-items:center;gap:10px}
  .tbar-lbl{flex:1;font-size:11px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:0.5px}
  .tbar-time{font-family:'Bebas Neue',sans-serif;font-size:38px;letter-spacing:3px;line-height:1;min-width:66px;text-align:right;transition:color 0.3s}
  .tbar-skip{background:none;border:1px solid var(--border2);color:var(--text2);border-radius:6px;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:1px;flex-shrink:0}
  .tbar-prog{height:4px;background:var(--border);border-radius:2px;margin-top:7px;overflow:hidden}
  .tbar-fill{height:100%;border-radius:2px;transition:width 1s linear,background 0.5s}
  </style>
</head>
<body>
<div id="app">
  <div class="header">
    <div><div class="logo">IRON LOG</div><div class="header-sub">Jeff's Plan</div></div>
    <div class="date-badge"><div class="date-num" id="dateNum"></div><div class="date-mon" id="dateMon"></div></div>
  </div>
  <div class="day-pill" id="dayPill"></div>
  <div class="cal-bar" id="calBar">
  <div><div class="cal-total" id="calTotal">~0 cal</div><div class="cal-label">Est. burned today</div></div>
  <div class="cal-sub" id="calSub">Add exercises</div>
</div>
<div class="row-list" id="rowList"></div>
  <button class="add-btn" onclick="addRow()">+ ADD EXERCISE</button>
</div>
<div class="sync-footer" id="syncFooter">
  <div class="sync-info" id="syncInfo"></div>
  <button class="sync-btn" id="syncBtn" onclick="handleSync()">Save to Sheets</button>
</div>
<div id="timerBar" style="display:none">
  <div class="tbar-top">
    <span class="tbar-lbl" id="tbarLabel">REST</span>
    <span class="tbar-time" id="tbarTime">1:00</span>
    <button class="tbar-skip" onclick="cancelTimer()">SKIP</button>
  </div>
  <div class="tbar-prog"><div class="tbar-fill" id="tbarFill" style="width:100%;background:var(--warn)"></div></div>
</div>
<div class="overlay" id="tipOverlay" style="display:none" onclick="closeTip()">
  <div class="tip-box" onclick="event.stopPropagation()">
    <div class="tip-hdr"><div class="tip-ttl" id="tipTitle"></div><button class="tip-cls" onclick="closeTip()">x</button></div>
    <div id="tipBody"></div>
  </div>
</div>
<script>
const APPS_SCRIPT_URL="https://script.google.com/macros/s/AKfycbzxv2Yzr6imw58OS4TxwPzWuMRCGaxFvgPevpt5br8hRw4wkrRLD_nzwcxhRsKUvkeN/exec";
const STORAGE_KEY="ironLog_v7";
const HISTORY_KEY="ironLog_hist";
const MAX_SETS=4;

const GROUP_OPTIONS=["Push","Pull","Legs","Cardio","Core"];
const GROUP_COLORS={Push:"#4F8EF7",Pull:"#E05C5C",Legs:"#F5A623",Cardio:"#3DBF7F",Core:"#3DBF7F"};
const GROUP_EMOJI={Push:"💪",Pull:"🏋️",Legs:"🦵",Cardio:"🏃",Core:"🎯"};

// MET values for calorie estimation (Jeff = 218 lbs / 99 kg)
var JEFF_KG=99;
var MET={"Chest Press Machine":5.0,"Pec Deck":4.0,"Cable Fly":4.0,"Lateral Raise (Dumbbells)":3.5,"Rear Delt Machine":3.5,"Machine Row":5.5,"Lat Pulldown (Neutral Grip)":5.0,"Seated Cable Row (Neutral Grip)":5.0,"Straight Arm Pulldown":4.5,"Face Pulls (Cable)":3.5,"Leg Press":6.0,"Romanian Deadlift (Dumbbells)":6.0,"Leg Curl Machine":4.5,"Leg Extension Machine":4.5,"Calf Raise Machine":3.5,"Hip Abductor Machine":3.0,"Plank":3.5,"Cable Crunch":3.5,"Seated Leg Raise":3.5,"Ab Machine":3.5,"Russian Twist":4.0,"Dead Bug":3.0,"Incline Treadmill Walk":7.5};
function calcExCal(exName,numSets){var met=MET[exName]||4.0;return Math.round(met*JEFF_KG*(1.83/60)*numSets);}
function calcSessionCal(){var t=0;var today=getTodayDate();for(var i=0;i<rows.length;i++){var r=rows[i];if(r.date!==today)continue;var nm=r.exercise==="__custom__"?r.customExercise:r.exercise;if(nm)t+=calcExCal(nm,r.sets.length);}return t;}
function updateCalBar(){var b=document.getElementById("calBar");if(!b)return;var c=calcSessionCal();document.getElementById("calTotal").textContent="~"+c+" cal";document.getElementById("calSub").textContent=c>300?"Great burn!":c>150?"Keep going!":"Add exercises";}

// Fat-loss focused plan — compound-heavy, joint-safe, metabolic
const EXERCISE_MAP={
  Push:["Chest Press Machine","Pec Deck","Cable Fly","Lateral Raise (Dumbbells)","Rear Delt Machine"],
  Pull:["Machine Row","Lat Pulldown (Neutral Grip)","Seated Cable Row (Neutral Grip)","Straight Arm Pulldown","Face Pulls (Cable)"],
  Legs:["Leg Press","Romanian Deadlift (Dumbbells)","Leg Curl Machine","Leg Extension Machine","Calf Raise Machine","Hip Abductor Machine"],
  Cardio:["Incline Treadmill Walk","Treadmill Run","Elliptical","Stationary Bike","Stair Climber","Row Machine"],
  Core:["Plank","Cable Crunch","Seated Leg Raise","Ab Machine","Russian Twist","Dead Bug"]
};

// Target reps/sets per exercise — higher reps = more metabolic
const TARGETS={
  "Chest Press Machine":"4 sets x 12-15 reps",
  "Pec Deck":"3 sets x 15 reps",
  "Cable Fly":"3 sets x 15-20 reps",
  "Lateral Raise (Dumbbells)":"3 sets x 15 reps",
  "Rear Delt Machine":"3 sets x 15 reps",
  "Machine Row":"4 sets x 12-15 reps",
  "Lat Pulldown (Neutral Grip)":"4 sets x 12-15 reps",
  "Seated Cable Row (Neutral Grip)":"3 sets x 12-15 reps",
  "Straight Arm Pulldown":"3 sets x 15-20 reps",
  "Face Pulls (Cable)":"3 sets x 20 reps",
  "Leg Press":"4 sets x 15-20 reps",
  "Romanian Deadlift (Dumbbells)":"3 sets x 12-15 reps",
  "Leg Curl Machine":"3 sets x 15 reps",
  "Leg Extension Machine":"3 sets x 15 reps",
  "Calf Raise Machine":"3 sets x 20 reps",
  "Hip Abductor Machine":"2 sets x 20 reps",
  "Plank":"3 sets — reps = hold time (sec)",
  "Cable Crunch":"3 sets x 20 reps",
  "Seated Leg Raise":"3 sets x 15 reps",
  "Ab Machine":"3 sets x 15 reps",
  "Russian Twist":"3 sets x 20 reps",
  "Dead Bug":"3 sets x 10 reps",
  "Incline Treadmill Walk":"40 min — 10% incline, 3.5-4 mph"
};

// Default weights (starting point — overridden by history after first session)
const DEF_W={
  "Chest Press Machine":[90,90,90,90],"Pec Deck":[70,70,70],"Cable Fly":[25,25,25],
  "Lateral Raise (Dumbbells)":[15,15,15],"Rear Delt Machine":[50,50,50],
  "Machine Row":[90,90,90,90],"Lat Pulldown (Neutral Grip)":[100,100,100,100],
  "Seated Cable Row (Neutral Grip)":[90,90,90],"Straight Arm Pulldown":[45,45,45],
  "Face Pulls (Cable)":[35,35,35],"Leg Press":[160,160,160,160],
  "Romanian Deadlift (Dumbbells)":[45,45,45],"Leg Curl Machine":[65,65,65],
  "Leg Extension Machine":[70,70,70],"Calf Raise Machine":[90,90,90],
  "Hip Abductor Machine":[70,70],"Plank":[0,0,0],"Cable Crunch":[45,45,45],
  "Seated Leg Raise":[0,0,0],"Ab Machine":[55,55,55],"Russian Twist":[12,12,12],
  "Dead Bug":[0,0,0],"Incline Treadmill Walk":[0]
};
const DEF_R={
  "Chest Press Machine":[12,12,12,12],"Pec Deck":[15,15,15],"Cable Fly":[15,15,15],
  "Lateral Raise (Dumbbells)":[15,15,15],"Rear Delt Machine":[15,15,15],
  "Machine Row":[12,12,12,12],"Lat Pulldown (Neutral Grip)":[12,12,12,12],
  "Seated Cable Row (Neutral Grip)":[12,12,12],"Straight Arm Pulldown":[15,15,15],
  "Face Pulls (Cable)":[20,20,20],"Leg Press":[15,15,15,15],
  "Romanian Deadlift (Dumbbells)":[12,12,12],"Leg Curl Machine":[15,15,15],
  "Leg Extension Machine":[15,15,15],"Calf Raise Machine":[20,20,20],
  "Hip Abductor Machine":[20,20],"Plank":[45,45,45],"Cable Crunch":[20,20,20],
  "Seated Leg Raise":[15,15,15],"Ab Machine":[15,15,15],"Russian Twist":[20,20,20],
  "Dead Bug":[10,10,10],"Incline Treadmill Walk":[40]
};

// YouTube search URLs — curated per exercise (update IDs here as needed)
// Format: youtube.com/watch?v=VIDEO_ID or search URL as fallback
const VIDEOS={
  "Chest Press Machine":"https://www.youtube.com/results?search_query=chest+press+machine+proper+form+men+over+50",
  "Pec Deck":"https://www.youtube.com/results?search_query=pec+deck+fly+machine+correct+form",
  "Cable Fly":"https://www.youtube.com/results?search_query=cable+fly+chest+proper+form",
  "Lateral Raise (Dumbbells)":"https://www.youtube.com/results?search_query=lateral+raise+proper+form+shoulder+safe",
  "Rear Delt Machine":"https://www.youtube.com/results?search_query=rear+delt+machine+proper+form",
  "Machine Row":"https://www.youtube.com/results?search_query=machine+row+proper+form+back",
  "Lat Pulldown (Neutral Grip)":"https://www.youtube.com/results?search_query=lat+pulldown+neutral+grip+proper+form",
  "Seated Cable Row (Neutral Grip)":"https://www.youtube.com/results?search_query=seated+cable+row+proper+form+back",
  "Straight Arm Pulldown":"https://www.youtube.com/results?search_query=straight+arm+pulldown+cable+lat+form",
  "Face Pulls (Cable)":"https://www.youtube.com/results?search_query=face+pulls+cable+proper+form+shoulder+health",
  "Leg Press":"https://www.youtube.com/results?search_query=leg+press+proper+form+knee+safe",
  "Romanian Deadlift (Dumbbells)":"https://www.youtube.com/results?search_query=dumbbell+romanian+deadlift+proper+form",
  "Leg Curl Machine":"https://www.youtube.com/results?search_query=leg+curl+machine+hamstring+proper+form",
  "Leg Extension Machine":"https://www.youtube.com/results?search_query=leg+extension+machine+quad+proper+form",
  "Calf Raise Machine":"https://www.youtube.com/results?search_query=calf+raise+machine+proper+form",
  "Hip Abductor Machine":"https://www.youtube.com/results?search_query=hip+abductor+machine+proper+form+glutes",
  "Plank":"https://www.youtube.com/results?search_query=perfect+plank+form+core",
  "Cable Crunch":"https://www.youtube.com/results?search_query=cable+crunch+ab+proper+form",
  "Seated Leg Raise":"https://www.youtube.com/results?search_query=seated+leg+raise+ab+lower+abs+form",
  "Ab Machine":"https://www.youtube.com/results?search_query=ab+crunch+machine+proper+form",
  "Russian Twist":"https://www.youtube.com/results?search_query=russian+twist+oblique+proper+form",
  "Dead Bug":"https://www.youtube.com/results?search_query=dead+bug+exercise+core+stability+form",
  "Incline Treadmill Walk":"https://www.youtube.com/results?search_query=incline+treadmill+walk+fat+burn+form"
};

// Built-in technique tips
const TIPS={};
TIPS["Chest Press Machine"]=["Sit tall, lower back against the pad. At higher reps (12-15) use a weight where the last 2 reps feel genuinely hard but form stays clean.","Push straight out exhaling on the press. Squeeze chest at full extension for 1 second — this increases time under tension and calorie burn.","Keep elbows at 45 degrees, not flared wide. This protects the shoulder and keeps the chest doing the work.","Short rest of 60 seconds between sets keeps heart rate elevated — key for fat burning. Only go to 90s if form is breaking down."];
TIPS["Pec Deck"]=["Adjust seat so elbows are at shoulder height, arms forming 90-degree angle. Do not let elbows go behind the shoulder plane.","Squeeze chest hard at the front of the movement — hold 1 second. At 15 reps this becomes a serious burn.","Control the return. Let it open only as far as is comfortable — do not force a deep stretch.","Great choice for joint safety — the machine path eliminates the instability of dumbbell flyes."];
TIPS["Cable Fly"]=["Set cables at chest height. Step forward, slight forward lean. Elbows stay slightly bent and fixed — do not straighten them during the movement.","Bring hands together in an arc, squeezing the chest. Think of hugging a barrel. Hold the peak for 1 second.","At 15-20 reps with moderate weight, cable flyes create sustained tension that burns well without joint stress.","Return slowly — 2-3 seconds. The eccentric phase at this rep range is where muscle and calorie burn compounds."];
TIPS["Lateral Raise (Dumbbells)"]=["Light weight, strict form. Raise to shoulder height only — no higher. This is a corrective and isolation move, not a strength move.","Lead with elbows, slight thumb-down rotation at the top. Avoid shrugging — keep shoulders down throughout.","15 reps strict is harder than 10 reps sloppy. If you have to swing to get the weight up, it is too heavy.","This builds the medial deltoid, creating shoulder width and protecting the rotator cuff long-term."];
TIPS["Rear Delt Machine"]=["This exercise directly counteracts the anterior dominance that caused your shoulder impingement. It is essential, not optional.","Sit facing the pad, arms at shoulder height. Drive handles back and wide, squeezing rear delts hard at full range.","Keep weight light and reps high — 15-20. The mind-muscle connection here takes a few sessions to develop.","Think of trying to touch your shoulder blades together at the back of the movement. That is the cue."];
TIPS["Machine Row"]=["The chest pad eliminates lower back strain — one of the best back exercises for men over 50. Use it every session.","Pull handles to your lower chest, driving elbows straight back. Squeeze mid-back hard for 1 second at full contraction.","At 12-15 reps, rows become a significant calorie burner because the back is a large muscle group.","Avoid shrugging. Keep shoulders down and back throughout. Upper traps should not be doing this work."];
TIPS["Lat Pulldown (Neutral Grip)"]=["Neutral grip reduces elbow stress significantly compared to wide pronated grip — critical during your recovery period.","Pull to upper chest, driving elbows straight down. Lean back only 10-15 degrees — no more.","Full stretch at the top — let shoulder blades rise before each rep. This range builds the lat effectively.","At 12-15 reps with 60 second rest, lat pulldowns contribute real metabolic load given how large the back muscles are."];
TIPS["Seated Cable Row (Neutral Grip)"]=["Close grip neutral attachment. Sit tall with a natural arch. Do not round forward even when stretching.","Pull handle to lower sternum. Squeeze shoulder blades together and hold 1 second. Then return with full control.","The stretch forward is part of the rep — let shoulder blades protract fully. This range is where lat growth happens.","At 12-15 reps you will feel this throughout your back. The large muscle mass involved makes it excellent for fat burning."];
TIPS["Straight Arm Pulldown"]=["Arms stay almost fully straight — elbow barely bends. This is the key. It isolates the lat without loading the bicep tendon.","Hinge slightly at hips, pull the bar down to your thighs using shoulder extension only.","Best lat movement during elbow recovery. Zero bending stress on the joint. Do not skip this one.","Squeeze the lats hard at the bottom and hold 1 second. At 15-20 reps this creates a deep lat burn."];
TIPS["Face Pulls (Cable)"]=["Cable at face height, rope attachment. Palms facing in. Step back enough to load the cable fully.","Pull rope to your face, separating hands and flaring elbows high and wide — double bicep position.","This is corrective medicine for your shoulder. It strengthens the external rotators and rear delts that prevent impingement.","Never skip this. Light weight, high reps, full range. This is the exercise that keeps your shoulder healthy long-term."];
TIPS["Leg Press"]=["Feet shoulder-width, mid-platform, toes slightly out. Lower to 90 degrees only — protect your knee with the old injury.","Drive through your whole foot, not just the toes. Never lock out the knee at the top — keep a slight bend.","At 15-20 reps the leg press becomes a serious cardiovascular exercise. You will be breathing hard. That is the goal.","The leg press is your highest-calorie-burn exercise. Legs are the largest muscle group. Push this one hard within your range."];
TIPS["Romanian Deadlift (Dumbbells)"]=["Hinge at hips, push them back as you lower. Keep back flat — do not round. Soft bend in the knees throughout.","Lower until you feel a strong hamstring stretch, usually mid-shin. Stop there — lower means rounded back.","Drive hips forward to come up, squeezing glutes at the top. This is a hip hinge, not a squat.","One of the best posterior chain exercises. Hamstrings and glutes are large muscles — this burns well at 12-15 reps."];
TIPS["Leg Curl Machine"]=["Pad just above heels, knees just off the bench edge. Curl up as far as possible and squeeze hamstrings hard at top.","Control the return over 2-3 seconds. The slow lowering phase is where hamstring development happens.","Avoid lifting hips off the pad on the way up — if this happens the weight is too heavy.","At 15 reps this becomes a genuine burn. Short 60 second rest keeps metabolic demand high."];
TIPS["Leg Extension Machine"]=["Pad on lower shins just above ankle. Extend to full lockout, squeeze quad hard for 1 second.","Lower slowly over 2-3 seconds. If you have knee discomfort reduce range — stop short of full extension if needed.","At 15 reps these become very challenging. The quad is a large muscle group — significant calorie burn at high reps.","Note: some knee conditions may limit this exercise. Pain (not burn) is always a reason to stop."];
TIPS["Calf Raise Machine"]=["Full stretch at the bottom is mandatory — lower heels as far as possible before each rep.","Rise up as high as possible, squeeze hard at the top for 1-2 seconds. Calves need full range to develop.","Calves respond to high reps — 20 reps is the target here. Slow and deliberate, no bouncing.","Short 45 second rest is fine for calves. They recover fast. Keep rest short to keep heart rate up."];
TIPS["Hip Abductor Machine"]=["Sit back, hips at 90 degrees. Push knees out slowly against the pads, squeeze outer glutes at full range.","This is joint protection, not just aesthetics. Strong hip abductors reduce knee valgus in squats and daily movement.","Keep it light — 20 reps. This is a corrective movement. No momentum.","At 2 sets of 20 this is a finisher. Keep rest to 45 seconds."];
TIPS["Plank"]=["Elbows under shoulders, body in a straight line head to heels. No sagging hips or raised glutes.","Brace your core as if bracing for a punch. Squeeze glutes. Breathe normally throughout.","Use the 45-second rest timer here as your plank hold timer — tap it, hold until it beeps in your head, release.","Build from 30 to 45 to 60 seconds over weeks. Two minutes is elite for a man over 50."];
TIPS["Cable Crunch"]=["Kneel facing the cable, rope at the back of your neck. Hips stay still throughout — all movement in the abs.","Round the upper back down — do not pull with your neck or hip flexors. Squeeze abs hard at the bottom.","Return slowly. At 20 reps this becomes a genuine ab burn. Keep weight moderate.","Short rest keeps core pumped and heart rate elevated."];
TIPS["Seated Leg Raise"]=["Sit on bench edge, hands gripping sides, legs extended. Lean back slightly and raise legs to hip height.","Use your lower abs to raise, not momentum. Slow and controlled lift and lower.","If too difficult, bend knees slightly. Work toward full extension over weeks.","15 reps controlled is significantly harder than it sounds. Do not rush these."];
TIPS["Ab Machine"]=["Pad on upper chest and shoulders. Crunch forward rounding upper back — not pulling with neck.","Squeeze hard at full contraction, hold 1 second. Return slowly.","15 reps at moderate weight with full contraction beats heavy weight with partial range.","Keep rest short at 45-60 seconds to maintain heart rate elevation."];
TIPS["Russian Twist"]=["Sit with knees bent, lean back 45 degrees. Hold weight and rotate side to side from the torso.","Touch weight to floor each side. Exhale on each rotation. Keep chest up.","If lower back hurts, keep feet on floor and reduce rotation range.","20 reps is challenging. Keep rest to 45 seconds."];
TIPS["Dead Bug"]=["Lie on back, arms up to ceiling, knees bent at 90 degrees in the air. Lower back pressed firmly to floor.","Slowly lower right arm overhead and extend left leg simultaneously. Lower back must not arch off the floor.","This exercise teaches core stability — the most important core function for protecting your spine long-term.","10 slow, controlled reps is enough. This is quality over quantity."];
TIPS["Incline Treadmill Walk"]=["Set incline 8-12 percent, speed 3.5-4.0 mph. Hold handrails for balance only — not for support.","This is your primary fat-burning tool. At this incline and pace you will hit 60-70 percent of max heart rate.","Target heart rate for fat burning: 120-135 bpm for you. Use the treadmill heart rate monitor or a watch.","40 minutes at this intensity burns approximately 400-500 calories — the single most effective session of the week."];

var defaultTip=["Set up properly before each rep — adjust the machine to fit your body, not the other way around.","Focus on the target muscle. Controlled reps with mind-muscle connection beat heavy sloppy reps.","Control the lowering phase over 2-3 seconds. This eccentric phase builds more muscle and burns more calories.","At higher rep ranges, expect real cardiovascular demand. Breathing hard is the goal — it means fat is burning."];

// ── STATE ──────────────────────────────────────────────────
var rows=[];
var timerInterval=null,timerRemaining=0,timerTotal=0,activeTimerRowId=null;

// ── HELPERS ────────────────────────────────────────────────
function getTodayDate(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}
function getTodayDay(){return ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][new Date().getDay()];}
function uid(){return "r"+Date.now()+Math.floor(Math.random()*99999);}
function loadLocal(k,d){try{var v=localStorage.getItem(k);return v!=null?JSON.parse(v):d;}catch(e){return d;}}
function saveLocal(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function getHistory(){return loadLocal(HISTORY_KEY,{});}
function saveHistory(name,sets,buddy){
  var h=getHistory();
  h[name]=sets.map(function(s){return{weight:String(s.weight||""),reps:String(s.reps||"")};});
  if(buddy!==undefined)h[name+"__buddy"]=buddy;
  saveLocal(HISTORY_KEY,h);
}
function getLastBuddy(name){var h=getHistory();return h[name+"__buddy"]||"";}
function getDefaultSets(name){
  var h=getHistory();
  if(h[name])return h[name].map(function(s){return{weight:String(s.weight||""),reps:String(s.reps||""),done:false};});
  var ws=DEF_W[name],rs=DEF_R[name];
  if(ws&&rs){
    var len=Math.max(ws.length,rs.length);
    return Array.from({length:len},function(_,i){return{weight:String(ws[i]||0),reps:String(rs[i]||0),done:false};});
  }
  return Array.from({length:MAX_SETS},function(){return{weight:"",reps:"",done:false};});
}
function persist(){saveLocal(STORAGE_KEY,rows);}
function eh(s){return String(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function emptyRow(){
  var last=rows[rows.length-1];
  return{id:uid(),date:getTodayDate(),group:last?last.group:"",exercise:"",customExercise:"",
    sets:Array.from({length:MAX_SETS},function(){return{weight:"",reps:"",done:false};}),
    notes:"",buddy:"",synced:false};
}

// ── INIT ───────────────────────────────────────────────────
function init(){
  var now=new Date();
  document.getElementById("dateNum").textContent=now.getDate();
  document.getElementById("dateMon").textContent=now.toLocaleString("default",{month:"short"}).toUpperCase();
  document.getElementById("dayPill").textContent=getTodayDay().toUpperCase()+" - "+getTodayDate();
  var saved=loadLocal(STORAGE_KEY,[]);
  rows=saved.length?saved:[emptyRow()];
  renderAll();updateFooter();updateCalBar();
}

// ── BUILD CARD ─────────────────────────────────────────────
function buildCard(row,idx){
  var color=GROUP_COLORS[row.group]||"#555";
  var displayName=row.exercise==="__custom__"?row.customExercise:row.exercise;
  var hasEx=(row.exercise&&row.exercise!=="__custom__")||row.customExercise;
  var doneCount=row.sets.filter(function(s){return s.done;}).length;
  var isTimerRow=activeTimerRowId===row.id;
  var target=TARGETS[row.exercise]||"";

  // Build tappable sequence chips
  var seqHtml="";
  if(row.group&&EXERCISE_MAP[row.group]){
    var exList=EXERCISE_MAP[row.group];
    var seqItems=exList.map(function(ex,i){
      var isCurrent=ex===row.exercise;
      return '<span class="seq-item'+(isCurrent?" current":"")
        +'" style="'+(isCurrent?"color:"+color+";border-color:"+color+";background:"+color+"18":"")+'"'
        +' data-rowid="'+row.id+'" data-ex="'+eh(ex)+'" onclick="onSeqTap(this)">'
        +'<span class="seq-num">'+(i+1)+'</span>'+eh(ex)+'</span>';
    }).join("");
    // Add custom chip at end
    seqItems+='<span class="seq-item custom-chip" style="color:var(--text3)" data-rowid="'+row.id+'" data-ex="__custom__" onclick="onSeqTap(this)">+ Custom</span>';
    seqHtml='<div class="seq-wrap">'+seqItems+'</div>';
  }

  // Progressive overload hint from history
  var prevHint="";
  if(row.exercise&&row.exercise!=="__custom__"){
    var hist=getHistory();
    if(hist[row.exercise]&&hist[row.exercise].length){
      var p=hist[row.exercise][0];
      var pw=parseFloat(p.weight||0),pr=parseInt(p.reps||0);
      if(pw>0){
        var nudgeW=pw+5;
        prevHint='<div class="prev-hint">Prev: <span>'+pw+'lbs x '+pr+'</span> — try <span>'+nudgeW+'lbs today</span></div>';
      }
    }
  }

  // First form cue
  var formCue="";
  if(row.exercise&&row.exercise!=="__custom__"){
    var tipArr=TIPS[row.exercise]||null;
    if(tipArr&&tipArr[1]) formCue='<div class="form-cue">'+eh(tipArr[1].substring(0,90)+(tipArr[1].length>90?"...":""))+'</div>';
  }

  // Build sets rows (compact single-row layout)
  var setsHtml=row.sets.map(function(s,si){
    return '<div class="set-row'+(s.done?" done":"")+'" id="sr-'+row.id+'-'+si+'">'
      +'<div class="set-num" style="background:'+(s.done?"#1a3a1a":color)+'" id="sn-'+row.id+'-'+si+'">'+(s.done?"&#10003;":(si+1))+'</div>'
      +'<input class="set-inp" type="number" inputmode="decimal" value="'+eh(s.weight)+'" placeholder="-" data-rowid="'+row.id+'" data-si="'+si+'" data-field="weight" oninput="onSetInput(this)"/>'
      +'<input class="set-inp" type="number" inputmode="numeric" value="'+eh(s.reps)+'" placeholder="-" data-rowid="'+row.id+'" data-si="'+si+'" data-field="reps" oninput="onSetInput(this)"/>'
      +'<button class="done-btn" style="background:'+(s.done?color+"22":"transparent")+';border-color:'+(s.done?color:color+"44")+';color:'+(s.done?color:"#555")+'" data-rowid="'+row.id+'" data-si="'+si+'" onclick="onDoneBtn(this)">'+(s.done?"DONE":"TAP DONE")+'</button>'
      +'</div>';
  }).join("");

  var card=document.createElement("div");
  card.className="card";
  card.id="card-"+row.id;
  card.style.borderColor=row.synced?"#1a3a1a":color+"44";

  var html='<div class="card-bar" style="background:'+color+'18">'
    +'<div class="card-idx" style="background:'+color+'">'+(idx+1)+'</div>'
    +'<div class="card-name">'+(displayName?'<strong>'+eh(displayName)+'</strong>':'<span class="ph">New Exercise</span>')
    +(hasEx?'<span class="prog-pill" style="background:'+color+'33;color:'+color+'" id="pp-'+row.id+'">'+doneCount+'/'+row.sets.length+'</span>':"")
    +'</div>'
    +(hasEx?'<button class="tip-btn" style="border-color:'+color+'66;color:'+color+'" data-ex="'+eh(displayName)+'" data-grp="'+eh(row.group)+'" onclick="onTipBtn(this)">&#128161;</button>':"")
    +(row.synced?'<span class="sync-ok">saved</span>':"")
    +'<button class="rm-btn" data-rowid="'+row.id+'" onclick="onRemove(this)">x</button>'
    +'</div>'
    +'<div class="card-body">'
    // Group + Exercise on same row
    +'<div class="ge-row">'
    +'<div class="field-wrap"><div class="field-lbl">Group</div><div class="sel-wrap">'
    +'<select data-rowid="'+row.id+'" data-field="group" onchange="onSelect(this)">'
    +'<option value="">Select</option>'
    +GROUP_OPTIONS.map(function(g){return'<option value="'+g+'"'+(row.group===g?" selected":"")+'>'+g+'</option>';}).join("")
    +'</select><span class="sel-arr" style="color:'+color+'">v</span></div></div>'
    // Exercise dropdown hidden when group set (sequence chips handle selection)
    +(row.group?"":'<div class="field-wrap"><div class="field-lbl">Exercise</div><div class="sel-wrap">'
    +'<select disabled style="color:#555"><option>Select Group first</option></select>'
    +'<span class="sel-arr">v</span></div></div>')
    // Hidden select keeps data binding for custom exercise
    +(row.exercise==="__custom__"?'<input class="custom-inp" style="border-color:'+color+'66;margin-top:4px" placeholder="Exercise name..." value="'+eh(row.customExercise)+'" data-rowid="'+row.id+'" data-field="customExercise" oninput="onSelect(this)"/>':"")
    +'</div>';  // end ge-row
    // Hidden select to keep data binding
    html+='<select data-rowid="'+row.id+'" data-field="exercise" onchange="onSelect(this)" style="display:none">'
    +(EXERCISE_MAP[row.group]||[]).map(function(ex){return'<option value="'+eh(ex)+'"'+(row.exercise===ex?" selected":"")+'>'+eh(ex)+'</option>';}).join("")
    +'<option value="__custom__"'+(row.exercise==="__custom__"?" selected":"")+'>custom</option>'
    +'</select>';

  // Sequence map
  if(seqHtml) html+=seqHtml;

  if(hasEx){
    // Prev overload nudge
    if(prevHint) html+=prevHint;
    // Target in white
    if(target) html+='<div class="target-row"><span>&#9654;</span>'+eh(target)+'</div>';
    // First form cue
    if(formCue) html+=formCue;

    // Rest timer with fat-burn emphasis
    html+='<div class="rest-section">'
      +'<div class="rest-header"><span class="rest-label">&#128293; Rest Timer</span><span class="rest-hint">Keep to 60s for fat burn</span></div>'
      +'<div class="rest-btns">'
      +[["30s",30],["45s",45],["60s",60],["90s",90]].map(function(p){
        return'<button class="rest-btn" style="background:'+(isTimerRow?color:"transparent")+';border-color:'+color+'77;color:'+(isTimerRow?"#fff":color)+'" data-secs="'+p[1]+'" data-label="'+eh(displayName||"Rest")+'" data-rowid="'+row.id+'" onclick="onRestBtn(this)">'+p[0]+'</button>';
      }).join("")
      +'</div></div>';

    // Sets header + rows
    html+='<div class="sets-hdr"><span>#</span><span>Weight lbs</span><span>Reps</span><span>Status</span></div>'
      +'<div id="sets-'+row.id+'">'+setsHtml+'</div>';
  }

  html+='<input class="notes-inp" placeholder="Notes..." value="'+eh(row.notes)+'" data-rowid="'+row.id+'" data-field="notes" oninput="onSelect(this)"/>'
    +'<input class="buddy-inp" placeholder="Buddy (e.g. 90x12 / 90x12)" value="'+eh(row.buddy||"")+'" data-rowid="'+row.id+'" data-field="buddy" oninput="onSelect(this)"/>'
    +'</div>';

  card.innerHTML=html;
  return card;
}

function renderAll(){
  var list=document.getElementById("rowList");
  list.innerHTML="";
  for(var i=0;i<rows.length;i++) list.appendChild(buildCard(rows[i],i));
}
function rerenderCard(rowId){
  var row=rows.find(function(r){return r.id===rowId;});
  if(!row) return;
  var old=document.querySelector('[id="card-'+rowId+'"]');
  if(old) old.replaceWith(buildCard(row,rows.indexOf(row)));
}

// ── HANDLERS ──────────────────────────────────────────────
function onSeqTap(el){
  var rowId=el.dataset.rowid, ex=el.dataset.ex;
  var row=rows.find(function(r){return r.id===rowId;});
  if(!row) return;
  if(ex==="__custom__"){
    row.exercise="__custom__"; row.customExercise="";
    row.sets=Array.from({length:MAX_SETS},function(){return{weight:"",reps:"",done:false};});
  } else {
    row.exercise=ex;
    row.sets=getDefaultSets(ex);
    row.buddy=getLastBuddy(ex);
  }
  row.synced=false; persist(); rerenderCard(rowId); updateFooter(); updateCalBar();
}

function onSelect(el){
  var rowId=el.dataset.rowid,field=el.dataset.field,value=el.value;
  var row=rows.find(function(r){return r.id===rowId;});
  if(!row) return;
  if(field==="group"){
    row.group=value;row.exercise="";row.customExercise="";
    row.sets=Array.from({length:MAX_SETS},function(){return{weight:"",reps:"",done:false};});
  } else if(field==="exercise"&&value&&value!=="__custom__"){
    row.exercise=value;
    row.sets=getDefaultSets(value);
    row.buddy=getLastBuddy(value);
  } else {
    row[field]=value;
  }
  if(field==="buddy"){var nm=row.exercise==="__custom__"?row.customExercise:row.exercise;if(nm)saveHistory(nm,row.sets,value);}
  row.synced=false;persist();rerenderCard(rowId);updateFooter();
}

function onSetInput(el){
  var rowId=el.dataset.rowid,si=parseInt(el.dataset.si),field=el.dataset.field;
  var row=rows.find(function(r){return r.id===rowId;});
  if(!row) return;
  row.sets[si][field]=el.value;
  // Propagate weight forward to subsequent sets
  if(field==="weight"&&el.value){
    for(var j=si+1;j<row.sets.length;j++){
      row.sets[j].weight=el.value;
      var inp=document.querySelector('[id="sr-'+rowId+'-'+j+'"] input[data-field="weight"]');
      if(inp) inp.value=el.value;
    }
  }
  row.synced=false;persist();updateFooter();
}

function onDoneBtn(el){
  var rowId=el.dataset.rowid,si=parseInt(el.dataset.si);
  var row=rows.find(function(r){return r.id===rowId;});
  if(!row) return;
  row.sets[si].done=!row.sets[si].done;
  var name=row.exercise==="__custom__"?row.customExercise:row.exercise;
  if(name) saveHistory(name,row.sets,row.buddy);
  persist();
  // Surgical DOM update
  var color=GROUP_COLORS[row.group]||"#555";
  var s=row.sets[si];
  var sr=document.getElementById("sr-"+rowId+"-"+si);
  var sn=document.getElementById("sn-"+rowId+"-"+si);
  if(sr){sr.className="set-row"+(s.done?" done":"");}
  if(sn){sn.innerHTML=s.done?"&#10003;":(si+1);sn.style.background=s.done?"#1a3a1a":color;}
  var btn=el;
  btn.style.background=s.done?color+"22":"transparent";
  btn.style.borderColor=s.done?color:color+"44";
  btn.style.color=s.done?color:"#555";
  btn.textContent=s.done?"DONE":"TAP DONE";
  var pill=document.getElementById("pp-"+rowId);
  if(pill){pill.textContent=row.sets.filter(function(x){return x.done;}).length+"/"+row.sets.length;}
  // Auto-start 60s rest timer when marking a set as DONE (not when undoing)
  if(s.done){
    var exName=row.exercise==="__custom__"?row.customExercise:row.exercise;
    var setLabel=(exName||"Exercise")+" — Set "+(si+1)+" done";
    startTimer(60,setLabel,rowId);
  } else {
    // Undoing a set — cancel any running timer for this row
    if(activeTimerRowId===rowId) cancelTimer();
  }
  updateFooter();
}

function onRemove(el){
  if(rows.length<=1) return;
  rows=rows.filter(function(r){return r.id!==el.dataset.rowid;});
  persist();renderAll();updateFooter();updateCalBar();
}
function onRestBtn(el){startTimer(parseInt(el.dataset.secs),el.dataset.label,el.dataset.rowid);}
function onTipBtn(el){openTip(el.dataset.ex,el.dataset.grp);}
function addRow(){rows.push(emptyRow());persist();renderAll();updateFooter();updateCalBar();updateCalBar();setTimeout(function(){window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});},50);}

// ── SYNC ──────────────────────────────────────────────────
function updateFooter(){
  var n=rows.filter(function(r){return !r.synced&&(r.exercise||r.customExercise);}).length;
  document.getElementById("syncInfo").innerHTML=n>0
    ?'<span style="color:#F5A623">&#9679; '+n+' unsaved</span>'
    :'<span style="color:#3DBF7F">&#9679; All saved</span>';
  var btn=document.getElementById("syncBtn");
  btn.style.borderColor="#4F8EF7";btn.style.color="#4F8EF7";btn.style.background="#1a1a2a";
}

async function handleSync(){
  var unsynced=rows.filter(function(r){return !r.synced&&(r.exercise||r.customExercise);});
  var btn=document.getElementById("syncBtn");
  if(!unsynced.length){btn.textContent="Nothing new";setTimeout(function(){btn.textContent="Save to Sheets";updateFooter();},2500);return;}
  btn.textContent="Saving...";btn.disabled=true;
  var values=unsynced.map(function(r){return[
    r.date,getTodayDay(),r.group,r.exercise==="__custom__"?r.customExercise:r.exercise,
    r.sets[0]?r.sets[0].weight||"":"",r.sets[0]?r.sets[0].reps||"":"",
    r.sets[1]?r.sets[1].weight||"":"",r.sets[1]?r.sets[1].reps||"":"",
    r.sets[2]?r.sets[2].weight||"":"",r.sets[2]?r.sets[2].reps||"":"",
    r.sets[3]?r.sets[3].weight||"":"",r.sets[3]?r.sets[3].reps||"":"",
    r.notes||"",r.buddy||""];});
  try{
    await fetch(APPS_SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify({rows:values})});
    unsynced.forEach(function(u){var r=rows.find(function(x){return x.id===u.id;});if(r)r.synced=true;});
    persist();renderAll();
    btn.textContent="Saved!";btn.style.color="#3DBF7F";btn.style.borderColor="#3DBF7F";btn.style.background="#1a3a1a";
    setTimeout(function(){btn.textContent="Save to Sheets";btn.disabled=false;updateFooter();},3000);
  }catch(err){
    btn.textContent="Failed";btn.style.color="#E05C5C";btn.style.borderColor="#E05C5C";btn.disabled=false;
    setTimeout(function(){btn.textContent="Save to Sheets";updateFooter();},4000);
  }
}

// ── TIMER BAR ─────────────────────────────────────────────
function startTimer(secs,label,rowId){
  clearInterval(timerInterval);
  timerRemaining=secs;timerTotal=secs;activeTimerRowId=rowId;
  var bar=document.getElementById("timerBar");
  document.getElementById("tbarLabel").textContent=label;
  bar.style.display="block";
  document.getElementById("syncFooter").style.bottom="60px";
  // Shift app content up so bar doesn't cover last card
  document.getElementById("app").style.paddingBottom="144px";
  tickTimer();
  timerInterval=setInterval(function(){
    timerRemaining--;
    if(timerRemaining<=0){timerRemaining=0;clearInterval(timerInterval);}
    tickTimer();
  },1000);
  // Update rest button appearance on card
  if(rowId) rerenderCard(rowId);
}

function tickTimer(){
  var min=Math.floor(timerRemaining/60),sec=timerRemaining%60;
  var done=timerRemaining===0;
  var pct=timerTotal>0?timerRemaining/timerTotal:0;
  var barColor=pct>0.5?"#F5A623":pct>0.2?"#E05C5C":"#E05C5C";
  if(done){barColor="#3DBF7F";}
  document.getElementById("tbarTime").textContent=done?"GO!":min+":"+(sec<10?"0":"")+sec;
  document.getElementById("tbarTime").style.color=done?"#3DBF7F":pct>0.5?"#F5A623":"#E05C5C";
  document.getElementById("tbarFill").style.width=(pct*100)+"%";
  document.getElementById("tbarFill").style.background=barColor;
  // Store original label on first tick before overwriting
  var lblEl=document.getElementById("tbarLabel");
  if(!lblEl.dataset.orig) lblEl.dataset.orig=lblEl.textContent;
  lblEl.textContent=done?"REST DONE — GO!":lblEl.dataset.orig;
}

function cancelTimer(){
  clearInterval(timerInterval);
  document.getElementById("timerBar").style.display="none";
  document.getElementById("syncFooter").style.bottom="0";
  document.getElementById("app").style.paddingBottom="88px";
  // Reset label storage
  var lblEl=document.getElementById("tbarLabel");
  if(lblEl) lblEl.dataset.orig="";
  if(activeTimerRowId){rerenderCard(activeTimerRowId);activeTimerRowId=null;}
}

// ── TIPS + VIDEO ───────────────────────────────────────────
function openTip(exName,group){
  document.getElementById("tipTitle").textContent=exName;
  document.getElementById("tipOverlay").style.display="flex";
  var emoji=GROUP_EMOJI[group]||"💪";
  var tipLines=TIPS[exName]||defaultTip;
  var lines="";
  for(var i=0;i<tipLines.length;i++){
    lines+='<div class="tip-line"><span class="tip-bullet">&#x203A;</span><span>'+eh(tipLines[i])+'</span></div>';
  }
  var videoUrl=VIDEOS[exName]||("https://www.youtube.com/results?search_query="+encodeURIComponent(exName+"+proper+form"));
  document.getElementById("tipBody").innerHTML=
    '<div class="tip-emoji">'+emoji+'</div>'
    +'<div class="tip-content">'+lines+'</div>'
    +'<a class="vid-btn" href="'+videoUrl+'" target="_blank" rel="noopener">&#9654; Watch Form Video on YouTube</a>';
}
function closeTip(){document.getElementById("tipOverlay").style.display="none";}
document.addEventListener("keydown",function(e){if(e.key==="Escape"){cancelTimer();closeTip();}});

try{init();}catch(err){document.getElementById("rowList").innerHTML='<div style="color:#E05C5C;padding:20px;font-size:13px">Error: '+err.message+'</div>';}
</script>
